<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <base href="/" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0b0b0f" />
  <title>FmcComic - Baca Komik Pro</title>

  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="assets/icon.png" type="image/jpeg" />

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>

<body class="overflow-x-hidden bg-[#0b0b0f] text-gray-200">

  <div id="progress-bar" style="width: 0%"></div>

  <nav id="main-nav" class="fixed top-0 w-full z-50 glass border-b border-white/5 transition-transform duration-300">
    <div class="container mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-8">
        <div class="flex items-center gap-3 cursor-pointer group" onclick="showHome()">
          <img src="assets/icon.png" onerror="this.src='https://via.placeholder.com/40'"
            class="w-9 h-9 rounded-xl object-cover border border-amber-500/50 shadow-lg shadow-amber-500/20 group-hover:scale-105 transition" />
          <h1 class="text-xl md:text-2xl font-extrabold text-amber-500 tracking-tight">
            Fmc<span class="text-white">Comic</span>
          </h1>
        </div>
        <div class="hidden md:flex gap-6 text-sm font-medium">
          <button onclick="showHome()" class="hover:text-amber-500 transition">Beranda</button>
          <button onclick="showOngoing()" class="hover:text-amber-500 transition">Ongoing</button>
          <button onclick="showCompleted()" class="hover:text-amber-500 transition font-bold text-green-400">Tamat</button>
        </div>
      </div>

      <div class="flex items-center gap-2 md:gap-3">
        <button onclick="toggleFilter()" class="w-10 h-10 flex items-center justify-center hover:bg-white/10 rounded-full transition">
          <i class="fa fa-search"></i>
        </button>
        <button onclick="toggleAuthModal()" id="btn-profile" class="w-10 h-10 flex items-center justify-center hover:bg-white/10 rounded-full transition relative">
          <i class="fa fa-user-circle text-xl"></i>
          <span id="login-status-dot" class="absolute top-2 right-2 w-2 h-2 bg-red-500 rounded-full border border-[#0b0b0f]"></span>
        </button>
      </div>
    </div>
  </nav>

  <div id="auth-modal" class="fixed inset-0 z-[100] hidden flex items-center justify-center p-4">
    <div class="absolute inset-0 bg-black/80 backdrop-blur-sm" onclick="toggleAuthModal()"></div>
    <div class="glass relative w-full max-w-sm rounded-3xl p-6 md:p-8 animate-fade-in shadow-2xl border-amber-500/20">
      <h2 class="text-2xl font-bold text-center mb-1">Akun Saya</h2>
      <p class="text-xs text-center text-gray-400 mb-6">Simpan riwayat & bookmark ke cloud.</p>

      <div id="auth-form-container">
        <div class="space-y-4">
          <div>
            <label class="text-xs font-bold ml-1 mb-1 block text-gray-400">Email</label>
            <input type="email" id="auth-email" class="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-3 focus:outline-none focus:border-amber-500 transition text-sm" placeholder="nama@email.com">
          </div>
          <div>
            <label class="text-xs font-bold ml-1 mb-1 block text-gray-400">Password</label>
            <input type="password" id="auth-pass" class="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-3 focus:outline-none focus:border-amber-500 transition text-sm" placeholder="Katasandi">
          </div>
          <button onclick="handleLogin()" id="btn-login-submit" class="amber-gradient w-full py-3 rounded-xl font-bold text-black mt-2 hover:scale-[1.02] transition shadow-lg shadow-amber-500/20">
            Masuk / Daftar
          </button>
        </div>
      </div>

      <div id="user-info-container" class="hidden text-center">
        <div class="w-20 h-20 bg-gradient-to-br from-amber-500 to-amber-700 rounded-full mx-auto mb-4 flex items-center justify-center text-3xl font-bold text-black shadow-lg">
          <i class="fa fa-user"></i>
        </div>
        <h3 id="user-email-display" class="font-bold text-lg truncate">user@email.com</h3>
        <p class="text-green-400 text-xs font-bold mb-6 flex justify-center items-center gap-1"><i class="fa fa-circle text-[6px]"></i> Terhubung ke Cloud</p>
        
        <div class="grid grid-cols-2 gap-3 mb-6">
          <button onclick="showHistory(); toggleAuthModal()" class="bg-white/5 p-3 rounded-xl border border-white/5 hover:border-amber-500/50 transition">
            <i class="fa fa-history text-amber-500 mb-1"></i>
            <div class="text-xs font-bold">Riwayat</div>
          </button>
          <button onclick="showBookmarks(); toggleAuthModal()" class="bg-white/5 p-3 rounded-xl border border-white/5 hover:border-amber-500/50 transition">
            <i class="fa fa-bookmark text-amber-500 mb-1"></i>
            <div class="text-xs font-bold">Favorit</div>
          </button>
        </div>

        <button onclick="handleLogout()" class="w-full py-3 rounded-xl border border-red-500/30 text-red-500 text-sm font-bold hover:bg-red-500/10 transition">
          Logout
        </button>
      </div>
    </div>
  </div>

  <div id="filter-panel" class="fixed top-16 left-0 w-full glass z-[45] hidden border-b border-amber-500/20 p-4 shadow-2xl backdrop-blur-xl">
    <div class="container mx-auto">
      <div class="flex flex-col gap-4 max-w-4xl mx-auto">
        <div class="relative w-full">
          <i class="fa fa-search absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
          <input type="text" id="search-input" onkeyup="handleSearch(event)" placeholder="Cari judul komik..."
            class="w-full bg-black/40 border border-white/10 rounded-xl py-3 pl-12 pr-4 focus:outline-none focus:border-amber-500 transition text-white placeholder-gray-500" />
        </div>
        <div class="flex flex-wrap gap-2 justify-between items-center">
            <div class="flex flex-wrap gap-2 flex-1">
              <select id="filter-genre" class="bg-zinc-900 border border-white/10 rounded-lg px-4 py-2 focus:outline-none focus:border-amber-500 text-xs text-gray-300">
                <option value="">Pilih Genre</option>
              </select>
              <select id="filter-type" class="bg-zinc-900 border border-white/10 rounded-lg px-4 py-2 focus:outline-none focus:border-amber-500 text-xs text-gray-300">
                <option value="">Semua Tipe</option>
                <option value="manga">Manga</option>
                <option value="manhwa">Manhwa</option>
                <option value="manhua">Manhua</option>
              </select>
            </div>
            <button onclick="applyAdvancedFilter()" class="amber-gradient px-6 py-2 rounded-lg font-bold text-black text-xs shadow-lg shadow-amber-500/20">Cari</button>
        </div>
      </div>
    </div>
  </div>

  <main class="container mx-auto mt-24 px-4 pb-32 min-h-screen animate-fade-in">
    <div id="content-area"></div>
  </main>

  <div id="mobile-nav" class="fixed bottom-0 w-full glass border-t border-white/5 flex justify-around p-3 md:hidden z-50 transition-transform duration-300 pb-safe shadow-[0_-10px_40px_rgba(0,0,0,0.5)]">
    <button onclick="showHome()" class="flex flex-col items-center gap-1 text-gray-400 active:text-amber-500 w-16 group">
      <i class="fa fa-compass text-xl group-hover:text-amber-500 transition"></i><span class="text-[10px] font-medium">Jelajah</span>
    </button>
    <button onclick="showOngoing()" class="flex flex-col items-center gap-1 text-gray-400 active:text-amber-500 w-16 group">
      <i class="fa fa-fire text-xl group-hover:text-amber-500 transition"></i><span class="text-[10px] font-medium">Update</span>
    </button>
    <button onclick="showHistory()" class="flex flex-col items-center gap-1 text-gray-400 active:text-amber-500 w-16 group">
      <i class="fa fa-history text-xl group-hover:text-amber-500 transition"></i><span class="text-[10px] font-medium">Riwayat</span>
    </button>
    <button onclick="toggleAuthModal()" class="flex flex-col items-center gap-1 text-gray-400 active:text-amber-500 w-16 group">
      <i class="fa fa-user text-xl group-hover:text-amber-500 transition"></i><span class="text-[10px] font-medium">Akun</span>
    </button>
  </div>

  <script src="script.js"></script>
</body>
</html>
